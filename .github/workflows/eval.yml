name: eval
# Paid checks. Smoke subset on PRs that can change answers; full suite nightly and on demand.
on:
  pull_request:
    paths: ["src/**", "config/**", "data/golden/**", "data/processed/chunks.jsonl"]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [smoke, full]
        default: full

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MODE: ${{ github.event_name == 'pull_request' && 'smoke' || inputs.mode || 'full' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('config/settings.yaml') }}
      - run: pip install -e ".[embed,dev]"
      # chunks.jsonl is committed, so CI never depends on EUR-Lex being reachable.
      - run: aiact build-index
      - run: python -m aiact_evals.run --mode "$MODE"
      - run: python -m aiact_evals.gate results/latest.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ env.MODE }}
          path: |
            results/report.html
            results/latest.json
