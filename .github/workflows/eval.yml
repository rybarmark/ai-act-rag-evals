name: eval
# Paid checks. Smoke subset on PRs that can change answers; full suite nightly and on demand.
on:
  pull_request:
    paths: ["src/**", "config/**", "data/golden/**", "data/processed/chunks.jsonl"]
  # Nightly full run: off until Phase 5 (gate + baseline), to keep spend at zero meanwhile.
  # schedule:
  #   - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [smoke, full]
        default: full

# Auth: Workload Identity Federation, no stored API key. GitHub issues a short-lived OIDC
# token, the Anthropic SDK exchanges it. The federation rule only trusts runs on main.
permissions:
  id-token: write
  contents: read

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Do not set ANTHROPIC_API_KEY here: if set at all, even empty, it overrides federation.
      ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
      ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
      ANTHROPIC_IDENTITY_TOKEN_FILE: /tmp/gha-jwt
      MODE: ${{ github.event_name == 'pull_request' && 'smoke' || inputs.mode || 'full' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('config/settings.yaml') }}
      - run: pip install -e ".[embed,dev]"
      # GitHub OIDC tokens expire after ~5 min and are single-use; a full eval runs longer.
      # Fetch one now and refresh it in the background; the SDK re-reads the file on refresh.
      - name: Fetch GitHub OIDC token (and keep it fresh)
        run: |
          cat > /tmp/fetch-oidc.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          url="$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com"
          curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$url" \
            | jq -er .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE.tmp"
          mv "$ANTHROPIC_IDENTITY_TOKEN_FILE.tmp" "$ANTHROPIC_IDENTITY_TOKEN_FILE"
          EOF
          chmod +x /tmp/fetch-oidc.sh
          /tmp/fetch-oidc.sh
          nohup bash -c 'while sleep 180; do /tmp/fetch-oidc.sh; done' >/dev/null 2>&1 &
      - name: Check Anthropic auth
        run: python -c "import anthropic; anthropic.Anthropic().models.list(limit=1); print('auth ok')"
      # chunks.jsonl is committed, so CI never depends on EUR-Lex being reachable.
      - run: aiact build-index
      # GitHub tokens are single-use (jti) and each new process exchanges its own, so fetch
      # a fresh one: the auth check above already used the previous token.
      - run: /tmp/fetch-oidc.sh && python -m aiact_evals.run --mode "$MODE"
      - run: python -m aiact_evals.gate results/latest.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ env.MODE }}
          path: |
            results/report.html
            results/latest.json
