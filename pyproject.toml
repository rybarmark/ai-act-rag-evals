[project]
name = "ai-act-rag-evals"
version = "0.1.0"
description = "A small RAG assistant over the EU AI Act, and the eval suite that measures and gates its quality."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Marek Rybař" }]
dependencies = [
  "anthropic>=0.40",
  "beautifulsoup4>=4.12",
  "jinja2>=3.1",
  "numpy>=1.26",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
# Local embedding model (pulls in torch). Not needed for unit tests.
embed = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
aiact = "aiact_rag.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["eval: calls the LLM API and costs money; deselected by default (run with -m eval)"]
addopts = "-m 'not eval'"

[tool.ruff]
line-length = 100
target-version = "py311"
